name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
      - uses: kevincobain2000/action-camo-purge@v1
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: main
      - name: Bust Version and License badge cache
        if: ${{ steps.release.outputs.release_created }}
        run: |
          sed -i -E "s#(badgen\.net/github/release/Wavez/debrief-skill)(\?[^)]*)?#\1?ref=${{ steps.release.outputs.sha }}#" README.md
          sed -i -E "s#(badgen\.net/github/license/Wavez/debrief-skill)\?[^)]*#\1?color=green\&ref=${{ steps.release.outputs.sha }}#" README.md
          if git diff --quiet README.md; then
            echo "No change needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: bust Version and License badge cache for ${{ steps.release.outputs.tag_name }}"
            git push
          fi
